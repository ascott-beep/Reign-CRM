<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>

<div style="--bg:#07111d;--side:#0a1522;--card:#0e1b2b;--line:#1c2b3d;--ink:#e9eef4;--ink2:#b9c5d3;--muted:#8796a8;--navy:#bae1ff;--navyInk:#0c2139;--track:#1a2839;--fill:#1f4469;--bar:#9db6cf;--dot:#e9eef4;--chip:#152335;--chipStrong:#15324f;--chipStrongInk:#bae1ff;--pos:#6fcf97;--posBg:#11301f;--warn:#ff8a66;--warnBg:#3a1a10;--neg:#ff8a66;--negBg:#3a1a10;--active:#132235;--sunk:#0b1724;--accent:#ff6a3d;--scrim:rgba(0, 0, 0, .55); width: 900px; min-height: 100%; position: relative; box-sizing: border-box; padding: 56px 40px 56px; display: flex; justify-content: center; align-items: flex-start; background: var(--bg); color: var(--ink); font-family: Inter Tight, Inter, system-ui, sans-serif; font-size: 14px">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: relative; width: 580px; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 24px 60px rgba(7, 17, 29, .28)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0"><div><h2 id="dlg-title" style="margin: 0; font-size: 18px; font-weight: 500">Take Joseph Aina off this search</h2><p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted)">Final interview · Chief Financial Officer, Vantage Logistics Group</p></div><button type="button" aria-label="Close" style="width: 32px; height: 32px; flex: none; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
<div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Outcome</span><div role="radiogroup" style="display: inline-flex; padding: 3px; border-radius: 4px; border: 1px solid var(--line); background: var(--card)"><button type="button" role="radio" aria-checked="" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: var(--navy); color: var(--navyInk)">Rejected</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Withdrawn</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">On hold</button></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Who decided</span><div role="radiogroup" style="display: inline-flex; padding: 3px; border-radius: 4px; border: 1px solid var(--line); background: var(--card)"><button type="button" role="radio" aria-checked="" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: var(--navy); color: var(--navyInk)">Client</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Candidate</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Reign</button></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Reason</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: var(--navyInk)">Experience gap</button><button type="button" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink2)">Salary expectations</button><button type="button" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink2)">Culture fit</button><button type="button" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink2)">Accepted another role</button><button type="button" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink2)">Location</button><button type="button" style="height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink2)">Other</button></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Note</span><textarea aria-label="Note" style="width: 100%; box-sizing: border-box; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px; resize: vertical;">Client preferred a candidate with listed-company experience.</textarea></div><button type="button" role="checkbox" aria-checked="" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer"><span style="width: 16px; height: 16px; flex: none; border-radius: 3px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: var(--navy); color: var(--navyInk); border: 0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></span>Keep Joseph in mind for future searches</button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line)"><button type="button" style="height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; text-decoration: none">Cancel</button><button type="button" style="height: 36px; padding: 0 18px; border-radius: 4px; border: 0; background: var(--navy); color: var(--navyInk); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px">Take off this search</button></div>
</div>
</div>
</body></html>
