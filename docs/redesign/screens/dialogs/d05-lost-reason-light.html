<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>

<div style="--bg:#f2f4f7;--side:#ffffff;--card:#ffffff;--line:#e1e6ec;--ink:#0c2139;--ink2:#36485c;--muted:#5d6b7a;--navy:#0c2139;--navyInk:#ffffff;--track:#e9edf2;--fill:#bae1ff;--bar:#6f8296;--dot:#0c2139;--chip:#eef1f5;--chipStrong:#e2f1ff;--chipStrongInk:#0c2139;--pos:#24704a;--posBg:#e2f2e9;--warn:#b3300f;--warnBg:#fdebe5;--neg:#a1260c;--negBg:#fbe3dc;--active:#eef1f5;--sunk:#f6f8fa;--accent:#ed3910;--scrim:rgba(12, 33, 57, .32); width: 900px; min-height: 100%; position: relative; box-sizing: border-box; padding: 56px 40px 56px; display: flex; justify-content: center; align-items: flex-start; background: var(--bg); color: var(--ink); font-family: Inter Tight, Inter, system-ui, sans-serif; font-size: 14px">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: relative; width: 540px; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 24px 60px rgba(7, 17, 29, .28)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0"><div><h2 id="dlg-title" style="margin: 0; font-size: 18px; font-weight: 500">Why was this lost?</h2><p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted)">Head of Business Control · Bracken Software Solutions · £38,000</p></div><button type="button" aria-label="Close" style="width: 32px; height: 32px; flex: none; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
<div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px"><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span>Went to another firm</button><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: var(--active); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 5px solid var(--navy)"></span>Hired internally</button><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span>Role cancelled</button><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span>Fee or terms</button><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span>No response</button><button type="button" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span>Other</button></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Which firm won it? <span style="color: var(--muted)">(optional)</span></span><input type="text" placeholder="e.g. another search firm" aria-label="Competitor" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px;"></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Revisit on <span style="color: var(--muted)">(optional)</span></span><input type="text" value="1 Mar 2027" aria-label="Revisit date" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px;"><div style="font-size: 12.5px; color: var(--muted); margin-top: 6px">Creates a task for Yagmur Demir to check back in with Bracken.</div></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line)"><button type="button" style="height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; text-decoration: none">Cancel</button><button type="button" style="height: 36px; padding: 0 18px; border-radius: 4px; border: 0; background: var(--navy); color: var(--navyInk); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px">Mark as lost</button></div>
</div>
</div>
</body></html>
