<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>

<div style="--bg:#f2f4f7;--side:#ffffff;--card:#ffffff;--line:#e1e6ec;--ink:#0c2139;--ink2:#36485c;--muted:#5d6b7a;--navy:#0c2139;--navyInk:#ffffff;--track:#e9edf2;--fill:#bae1ff;--bar:#6f8296;--dot:#0c2139;--chip:#eef1f5;--chipStrong:#e2f1ff;--chipStrongInk:#0c2139;--pos:#24704a;--posBg:#e2f2e9;--warn:#b3300f;--warnBg:#fdebe5;--neg:#a1260c;--negBg:#fbe3dc;--active:#eef1f5;--sunk:#f6f8fa;--accent:#ed3910;--scrim:rgba(12, 33, 57, .32); width: 900px; min-height: 100%; position: relative; box-sizing: border-box; padding: 56px 40px 56px; display: flex; justify-content: center; align-items: flex-start; background: var(--bg); color: var(--ink); font-family: Inter Tight, Inter, system-ui, sans-serif; font-size: 14px">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: relative; width: 620px; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 24px 60px rgba(7, 17, 29, .28)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0"><div><h2 id="dlg-title" style="margin: 0; font-size: 18px; font-weight: 500">Add a candidate to this search</h2><p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted)">Chief Financial Officer · Vantage Logistics Group</p></div><button type="button" aria-label="Close" style="width: 32px; height: 32px; flex: none; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
<div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid var(--navy); border-radius: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"></path></svg><input type="search" value="finance director" aria-label="Search people" style="flex: 1 1 0%; border: 0px; background: transparent; color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px; outline: none;"></label><div style="border: 1px solid var(--line); border-radius: 4px"><button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 0; background: var(--active); font: inherit; color: var(--ink); cursor: pointer"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 5px solid var(--navy)"></span><span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-size: 14px">Amara Okonkwo</span><span style="display: block; font-size: 13px; color: var(--muted); margin-top: 2px">VP Finance</span></span><span style="display: none"></span></button><button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; color: var(--muted); cursor: default"><span style="width: 16px; height: 16px; flex: none"></span><span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-size: 14px">Joseph Aina</span><span style="display: block; font-size: 13px; color: var(--muted); margin-top: 2px">Finance Director</span></span><span style="display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; padding: 3px 10px; border-radius: 3px; white-space: nowrap; background: var(--chip); color: var(--muted)">Rejected from this search</span></button><button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; color: var(--ink); cursor: pointer"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted)"></span><span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-size: 14px">Katarzyna Wysocki</span><span style="display: block; font-size: 13px; color: var(--muted); margin-top: 2px">Head of M&amp;A</span></span><span style="display: none"></span></button><button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; color: var(--muted); cursor: default"><span style="width: 16px; height: 16px; flex: none"></span><span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-size: 14px">Nisha Patel</span><span style="display: block; font-size: 13px; color: var(--muted); margin-top: 2px">Commercial Finance Director</span></span><span style="display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; padding: 3px 10px; border-radius: 3px; white-space: nowrap; background: var(--chip); color: var(--muted)">Already on this search</span></button><div style="padding: 12px; border-top: 1px solid var(--line); font-size: 13.5px"><a href="#" style="color: var(--ink2)">+ Create a new person</a></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Start them at</span><div role="radiogroup" style="display: inline-flex; padding: 3px; border-radius: 4px; border: 1px solid var(--line); background: var(--card)"><button type="button" role="radio" aria-checked="" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: var(--navy); color: var(--navyInk)">Identified</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Approached</button></div><div style="font-size: 12.5px; color: var(--muted); margin-top: 6px">Identified = on the longlist. Approached = you have already been in touch.</div></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px"><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Fit</span><div role="radiogroup" style="display: inline-flex; padding: 3px; border-radius: 4px; border: 1px solid var(--line); background: var(--card)"><button type="button" role="radio" aria-checked="" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: var(--navy); color: var(--navyInk)">Strong</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Good</button><button type="button" role="radio" style="height: 30px; padding: 0 14px; border-radius: 3px; border: 0; font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink2)">Possible</button></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">CV</span><div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 1px dashed var(--line); border-radius: 4px; font-size: 13.5px; color: var(--ink2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Drop a CV or browse</div></div></div><div><span style="display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px">Note</span><textarea aria-label="Note" placeholder="Why they fit this role" style="width: 100%; box-sizing: border-box; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px; resize: vertical;"></textarea></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line)"><button type="button" style="height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; text-decoration: none">Cancel</button><button type="button" style="height: 36px; padding: 0 18px; border-radius: 4px; border: 0; background: var(--navy); color: var(--navyInk); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px">Add to search</button></div>
</div>
</div>
</body></html>
