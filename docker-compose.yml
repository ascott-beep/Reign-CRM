services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reign
      POSTGRES_PASSWORD: reign_dev_password
      POSTGRES_DB: reign_crm
    ports:
      - "5432:5432"
    volumes:
      - reign_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reign -d reign_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reign_crm_pgdata:
